<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | DocuSphere</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #101827, #243b55);
            padding: 20px;
        }

        .register-card {
            width: 100%;
            max-width: 440px;
            background: white;
            padding: 38px 32px;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            color: #2563eb;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin: 8px 0 28px;
        }

        h2 {
            text-align: center;
            color: #1e293b;
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #334155;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 17px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .login {
            text-align: center;
            margin-top: 22px;
            color: #64748b;
        }

        .login a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .errors {
            color: #dc2626;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .errors ul {
            padding-left: 20px;
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>

<body>

    <div class="register-card">

        <div class="logo">DocuSphere</div>
        <p class="subtitle">Powered by Nexora AI</p>

        <h2>Create Your Account</h2>

        <form method="POST">
            {% csrf_token %}

            {% if form.errors %}
                <div class="errors">
                    {{ form.errors }}
                </div>
            {% endif %}

            <label for="id_username">Username</label>
            <input
                type="text"
                name="username"
                id="id_username"
                placeholder="Choose a username"
                required
            >

            <label for="id_password1">Password</label>
            <input
                type="password"
                name="password1"
                id="id_password1"
                placeholder="Create a password"
                required
            >

            <label for="id_password2">Confirm Password</label>
            <input
                type="password"
                name="password2"
                id="id_password2"
                placeholder="Enter password again"
                required
            >

            <button type="submit">Create Account</button>
        </form>

        <div class="login">
            Already have an account?
            <a href="{% url 'login' %}">Login</a>
        </div>

        <div class="footer">
            © DocuSphere | Powered by Nexora AI
        </div>

    </div>

</body>
</html>
